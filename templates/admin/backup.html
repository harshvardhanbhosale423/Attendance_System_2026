{% extends "base.html" %}
{% block title %}Database Backup{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">Database Backup</h4>
<div class="card-panel mb-3" style="max-width:640px;">
  <form method="POST">
    <button class="btn btn-primary">Create Backup Now</button>
  </form>
</div>

<div class="card-panel" style="max-width:640px;">
  <h6 class="fw-bold mb-3">Existing Backups</h6>
  {% if files %}
  <ul class="list-group list-group-flush">
    {% for f in files %}
    <li class="list-group-item d-flex justify-content-between align-items-center px-0">
      {{ f }}
      <a href="{{ url_for('admin.backup_download', filename=f) }}" class="btn btn-sm btn-outline-primary">Download</a>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="text-muted mb-0">No backups created yet.</p>
  {% endif %}
</div>
{% endblock %}
